name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --build-system native --sdk "$(xcrun --sdk macosx --show-sdk-path)"
      - name: Validate scripts
        run: |
          bash -n scripts/build-app.sh scripts/sign-app.sh scripts/prepare-release.sh scripts/create-dmg.sh
          python3 scripts/export-source.py "$RUNNER_TEMP/Langg-source.zip"
